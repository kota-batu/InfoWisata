<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Bio Card Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="loginScreen">
  <div class="badge-card">
    <div class="badge-punch"></div>
    <div class="badge-avatar">BC</div>
    <div class="login-title">Bio Card Marketing</div>
    <div class="login-sub">Masuk ke Admin CMS</div>

    <label class="field-label" for="passwordInput">Password</label>
    <input type="password" id="passwordInput" class="field-input" placeholder="Masukkan password admin">
    <div id="loginError">Password salah. Coba lagi.</div>
    <button class="btn-primary" id="loginBtn" style="margin-top:18px;" onclick="handleLogin()">Masuk</button>
  </div>
</div>

<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script src="login.js"></script>
</body>
</html>
